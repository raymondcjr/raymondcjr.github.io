<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Raymond | Volkswagen Specialist</title>

  <!-- ===== FONTS ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap"
    rel="stylesheet">
  
  <!-- ===== ICONS ===== -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    /* = PAGE VARIABLES = */
    :root {
      --bg-image: url("JettaGLIBG.jpg");

      --silver: #C6C6C6;
      --med-silver: #D5D5D5;
      --bright-silver: #D8D8D8;
      --light-silver: #CECECE;
      --gray-silver: #B0B0B0;
      --gray: #999999;
      --gray-med: #A0A0A0;
      --manila: #E7DCB6;
      --white: #F5F5F5;
      --bright-blue: #64A0F2;

      /* CUSTOM ECHO PALETTE */
      --echo-deep-blue: #24385F;
      --echo-light-blue: #6996C7;      
      --echo-soft-white: #F7F5F2;
      --echo-cool-gray: #A4A8AE;
      
      --card-bg: rgba(51, 51, 51, 0.40);
      --page-overlay: rgba(0, 0, 0, 0.25);
    }

    /* = PAGE = */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Times New Roman, serif;
      background:
        var(--bg-image)
        center / cover
        no-repeat
        fixed;
    }

    /* = BACKGROUND OVERLAY = */
    .overlay {
      position: absolute;
      inset: 0;
      background: var(--page-overlay);
      pointer-events: none;
    }

    /* = PAGE CONTAINER = */
    .container {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      text-align: center;
    }


    /* = CARD = */
    .card {
      padding: 30px 24px 42px;
      background: var(--card-bg);
      border-radius: 18px;
      backdrop-filter: blur(10px);
      text-align: center;
    }


    /* = IDENTITY = */
    .name {
      margin: 0;
      font-family: "Alex Brush", cursive;
      font-size: 44px;
      font-weight: 400;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      color: var(--echo-soft-white);

      text-shadow:
        0 1px 0 rgba(255,255,255,.10),
        0 1px 2px rgba(0,0,0,.14);
    }

    /* = PRIMARY ACTION — ADD TO CONTACTS = */
    .btn {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: inline-block;
      width: auto;
      min-width: 155px;
      max-width: 70%;
      padding: 12px 22px;
      margin: 14px auto;
      margin-top: 29px;

      border: none;
      border-radius: 30px;
      text-align: center;
      text-decoration: none;
      font-weight: 500;
      color: var(--echo-soft-white);

      background:
        linear-gradient(
          180deg,
          #416BA8 0%,
          #31558B 26%,
          #223C69 60%,
          #162542 100%
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.10),
        inset 0 -2px 2px rgba(0,0,0,.20),
        0 7px 17px rgba(0,0,0,.29);
    }

    /* BUTTON LABEL */
    .btn-label {
      position: relative;
      z-index: 4;      
    }

    /* BUTTON INTERNAL ENERGY */
    .btn-energy {
      position: absolute;
      z-index: 1;
      inset: 2px;
      border-radius: inherit;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at 50% 51%,
          rgba(88,134,238,0.72) 0%,
          rgba(75,117,221,0.60) 7%,
          rgba(62,102,202,0.552) 38%,
          rgba(36,72,154,0.126) 71%,
          rgba(36,72,154,0.042) 81%,
          rgba(36,72,154,0) 90%
        );

      transform: scale(1.30,1.19);
      transform-origin: 50% 51%;
      opacity: 0;
      animation:
        internal-energy-cycle
        5s
        ease-in-out
        infinite;
    }

   /* BUTTON ENERGY ANIMATION */
    @keyframes internal-energy-cycle {
        0%   { opacity: 0; }
        10%  { opacity: 0; }
        15%  { opacity: .053; }
        20%  { opacity: .120; }
        25%  { opacity: .172; }
        30%  { opacity: .239; }
        60%  { opacity: .70; }
        72%  { opacity: .70; }
        78%  { opacity: .504; }
        84%  { opacity: .318; }
        90%  { opacity: .159; }
        96%  { opacity: .053; }
        100% { opacity: 0; }
    } 
    
    /* BUTTON UPPER MATERIAL RESPONSE */
    .btn::before {
      content: "";
      position: absolute;
      z-index: 2;
      left: 9%;
      right: 9%;
      top: 4px;
      height: 36%;
      border-radius: 999px;

      background:
        linear-gradient(
          to bottom,
          rgba(63,129,220,.18) 0%,
          rgba(42,101,190,.07) 38%,
          rgba(31,75,150,.020) 70%,
          rgba(31,75,150,0) 100%
        );

      filter: blur(10px);
      pointer-events: none;
    }

    /* BUTTON EDGE TREATMENT */
    .btn::after {
      content: "";
      position: absolute;
      z-index: 3;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.18),
        inset 0 -1px 0 rgba(0,0,0,.42);
    }

    /* = CONTACT ACTIONS = */
    .icon-row {
      display: flex;
      justify-content: space-around;
      margin-top: 18px;
    }

    .icon {
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.19);
      text-decoration: none;
      color: white;
      font-size: 20px;
    }

    .phone {
      color: #25D366;
    }

    .message {
      color: var(--echo-light-blue);
    }

    .email {
      color: var(--manila);
    }

    /* = BRAND SIGNATURE = */
    .brand-footer {
      margin-top: 57px;
      display: flex;
      justify-content: center;
    }

    .brand-footer a {
      display: inline-flex;
    }

    .brand-signature {
      width: 24px;
      height: 24px;
      display: block;
    }

    /* = ACCESSIBILITY — REDUCED MOTION = */
    @media (prefers-reduced-motion: reduce) {

      .btn-energy {
        animation: none;
        opacity: 0;
      }
    }

  </style>
</head>

<body>
  <!-- BACKGROUND OVERLAY -->
  <div class="overlay"></div>

  <!-- PAGE CONTENT -->
  <main class="container">
    <div class="card">

      <!-- = IDENTITY = -->
      <h1 class="name">Raymond</h1>

      <!-- = PRIMARY ACTION = -->
      <a
        class="btn"
        id="contactButton"
        href="contact.vcf"
        download>

        <span
          class="btn-energy"
          aria-hidden="true">
        </span>

        <span class="btn-label">
          Add to Contacts
        </span>

      </a>

      <!-- = CONTACT ACTIONS = -->
      <div class="icon-row">

        <a
          class="icon phone"
          href="tel:7276312950"
          aria-label="Call Raymond">

          <i
            class="fa-solid fa-phone"
            aria-hidden="true">
          </i>

        </a>

        <a
          class="icon message"
          href="sms:7276312950"
          aria-label="Text Raymond">

          <i
            class="fa-solid fa-message"
            aria-hidden="true">
          </i>

        </a>

        <a
          class="icon email"
          href="mailto:raymondcjr.vw@gmail.com"
          aria-label="Email Raymond">

          <i
            class="fa-solid fa-envelope"
            aria-hidden="true">
          </i>

        </a>

      </div>

      <!-- = BRAND SIGNATURE = -->
      <div class="brand-footer">

        <a
          href="https://www.vw.com"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit the official Volkswagen website">

          <img
            class="brand-signature"
            src="VW-logo-white.svg"
            alt="Volkswagen">

        </a>

      </div>

    </div>

  </main>

  <!-- = CONTACT BUTTON HAPTIC FEEDBACK = -->

  <script>

    const contactButton =
      document.getElementById("contactButton");

    contactButton.addEventListener("click", () => {

      if ("vibrate" in navigator) {
        navigator.vibrate(11);
      }

    });

  </script>

</body>
</html>
